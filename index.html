<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Financeiro Familiar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-6">
  <div class="max-w-xl mx-auto space-y-6">
    
    <!-- Cabeçalho & Balanço -->
    <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h1 class="text-xl font-bold text-slate-900">Gastos da Casa 💰</h1>
      <p class="text-xs text-slate-500">Sincronizado em tempo real</p>
      
      <div class="mt-4 pt-4 border-t border-slate-100 flex justify-between items-center">
        <span class="text-sm font-medium text-slate-600">Total acumulado:</span>
        <span id="total-geral" class="text-2xl font-bold text-rose-600">R$ 0,00</span>
      </div>
    </header>

    <!-- Formulário de Novo Gasto -->
    <form id="form-gasto" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Novo Lançamento</h2>
      
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Descrição</label>
        <input type="text" id="desc" placeholder="Ex: Supermercado, Farmácia" required
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Valor (R$)</label>
          <input type="number" step="0.01" id="valor" placeholder="0,00" required
            class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Quem gastou?</label>
          <select id="autor" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
            <option value="Ele">Ele</option>
            <option value="Ela">Ela</option>
            <option value="Ambos">Ambos / Casa</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Categoria</label>
        <select id="categoria" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
          <option value="Mercado">Alimentação / Mercado</option>
          <option value="Moradia">Contas da Casa</option>
          <option value="Transporte">Transporte / Combustível</option>
          <option value="Lazer">Lazer / Restaurantes</option>
          <option value="Saúde">Saúde / Farmácia</option>
          <option value="Outros">Outros</option>
        </select>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition text-sm">
        Salvar Despesa
      </button>
    </form>

    <!-- Lista de Gastos -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">Histórico Recente</h2>
      <ul id="lista-gastos" class="divide-y divide-slate-100 text-sm">
        <li class="py-3 text-slate-400 text-center">Carregando registros...</li>
      </ul>
    </section>

  </div>

  <!-- Firebase Modular Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } 
      from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    // SUBSTITUA PELAS SUAS CHAVES DO FIREBASE:
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_PROJETO.firebaseapp.com",
      projectId: "SEU_PROJETO",
      storageBucket: "SEU_PROJETO.appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const transacoesCol = collection(db, "gastos");

    const form = document.getElementById("form-gasto");
    const lista = document.getElementById("lista-gastos");
    const totalEl = document.getElementById("total-geral");

    // Salvar novo registro
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const desc = document.getElementById("desc").value;
      const valor = parseFloat(document.getElementById("valor").value);
      const autor = document.getElementById("autor").value;
      const categoria = document.getElementById("categoria").value;

      await addDoc(transacoesCol, {
        descricao: desc,
        valor: valor,
        autor: autor,
        categoria: categoria,
        data: new Date()
      });

      form.reset();
    });

    // Ouvinte em tempo real (atualiza no celular de ambos instantaneamente)
    const q = query(transacoesCol, orderBy("data", "desc"));
    onSnapshot(q, (snapshot) => {
      lista.innerHTML = "";
      let total = 0;

      if (snapshot.empty) {
        lista.innerHTML = '<li class="py-3 text-slate-400 text-center">Nenhum gasto registrado.</li>';
      }

      snapshot.forEach((docItem) => {
        const item = docItem.data();
        total += item.valor;

        const li = document.createElement("li");
        li.className = "py-3 flex justify-between items-center gap-2";
        li.innerHTML = `
          <div>
            <div class="font-medium text-slate-900">${item.descricao}</div>
            <div class="text-xs text-slate-500">${item.categoria} • Pago por <strong>${item.autor}</strong></div>
          </div>
          <div class="flex items-center gap-3">
            <span class="font-semibold text-slate-800">R$ ${item.valor.toFixed(2)}</span>
            <button onclick="removerGasto('${docItem.id}')" class="text-xs text-rose-500 hover:text-rose-700 font-bold p-1">✕</button>
          </div>
        `;
        lista.appendChild(li);
      });

      totalEl.textContent = `R$ ${total.toFixed(2)}`;
    });

    window.removerGasto = async (id) => {
      await deleteDoc(doc(db, "gastos", id));
    };
  </script>
</body>
</html>
